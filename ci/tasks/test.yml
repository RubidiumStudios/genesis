platform: linux

image_resource:
  type: docker-image
  source:
    repository: ((docker.genesis-ci-image-path))
    tag:        latest

inputs:
  - name: git
  - name: git-ci

params:
  REPO_ROOT:         git
  CI_ROOT:           git-ci
  GITHUB_USER:       ((github.username))
  GITHUB_AUTH_TOKEN: ((github.access_token))
  # Newline-separated regexes matching references to resources a reader of
  # this repository cannot reach.  Held as a credential rather than in the
  # tree: publishing the shape of the identifiers here would defeat the
  # check that looks for them.  See t/sanity-tests/no-private-refs.t.
  GENESIS_PRIVATE_REF_PATTERNS: ((ci.private_ref_patterns))

run:
  path: "git/ci/scripts/test"
  args: []
